<mat-toolbar class="toolbar">
  <button mat-button routerLink="/" class="brand" type="button">
    <span class="brand-logo" aria-hidden="true">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <path d="M12 15l2.5 2.5L12 20l-2.5-2.5L12 15z"></path>
      </svg>
    </span>
    <span class="brand-name">Bookify</span>
  </button>

  <nav class="nav-links" aria-label="Navegación principal">
    @if (session.isAuthenticated()) {
      <a
        mat-button
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Catálogo
      </a>
    }
    @if (session.isClient()) {
      <a mat-button routerLink="/mis-reservas" routerLinkActive="active-link">Mis reservas</a>
    }
    @if (session.isAdmin()) {
      <a mat-button routerLink="/admin" routerLinkActive="active-link">Administración</a>
    }
  </nav>

  <span class="spacer"></span>

  <button
    mat-icon-button
    (click)="themeService.toggle()"
    type="button"
    [attr.aria-label]="themeService.dark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    class="theme-toggle"
  >
    @if (themeService.dark()) {
      <mat-icon aria-hidden="true">light_mode</mat-icon>
    } @else {
      <mat-icon aria-hidden="true">dark_mode</mat-icon>
    }
  </button>

  @if (session.isAuthenticated()) {
    <span class="user-info">
      <span class="user-avatar" aria-hidden="true">{{ avatarInitial() }}</span>
      <span class="user-name">{{ session.user()?.name }}</span>
      <span class="role-chip">{{ roleLabel() }}</span>
    </span>
    <button mat-button (click)="logout()" type="button" class="logout-btn">
      Salir
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="auth-active">Iniciar sesión</a>
    <a mat-button routerLink="/register" routerLinkActive="auth-active">Registrarse</a>
  }
</mat-toolbar>
